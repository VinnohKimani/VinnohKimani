name: Generate Profile Visuals

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      #  Clone repository files into the virtual runner environment
      - name: Checkout repository
        uses: actions/checkout@v3

      # SCalculate the current time slot to alternate between 3 graph modes
      - name: Determine MODE
        id: determine-mode
        run: |
          # Extract current hour in UTC (00 through 23)
          HOUR=$(date +%H)
          
          # Divide current hour by 6 to get the 6-hour interval index (0, 1, 2, or 3)
          # '10#' forces base-10 arithmetic so leading zeros (e.g., '08') do not break bash
          INDEX=$(( 10#$HOUR / 6 ))
          MOD=$(( INDEX % 3 ))
          if [ $MOD -eq 0 ]; then
            echo "mode=graph" >> $GITHUB_OUTPUT
          elif [ $MOD -eq 1 ]; then
            echo "mode=pacman" >> $GITHUB_OUTPUT
          else
            echo "mode=snake" >> $GITHUB_OUTPUT
          fi
          
      - name: Create dist directory
        run: mkdir -p dist

      - name: Generate Activity Line Graph
        if: steps.determine-mode.outputs.mode == 'graph'
        uses: Ashutosh00710/github-readme-activity-graph@main
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          target_branch: main
          output_filepath: dist/contribution-graph.svg
          theme: react-dark
          area: true
          hide_border: true

      - name: Generate Pacman
        if: steps.determine-mode.outputs.mode == 'pacman'
        uses: abozanona/pacman-contribution-graph@main
        with:
          github_user_name: ${{ github.repository_owner }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_OPTIONS: "--max_old_space_size=8192" # Provides extra RAM allocation for rendering

      # Move Pacman dark output to dist
      - name: Move Pacman output to dist/contribution-graph.svg
        if: steps.determine-mode.outputs.mode == 'pacman'
        run: |
          mv dist/pacman-contribution-graph-dark.svg dist/contribution-graph.svg

      - name: Generate Snake
        if: steps.determine-mode.outputs.mode == 'snake'
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: dist/contribution-graph.svg?palette=github-dark
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit and push generated graph
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: update contribution graph [${{ steps.determine-mode.outputs.mode }}]"

          
