name: Generate Profile Visuals

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "Which graph to generate"
        type: choice
        default: auto
        options:
          - auto
          - space
          - pacman
          - snake

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Pick mode: manual choice wins, otherwise rotate every 6 hours
      - name: Determine MODE
        id: determine-mode
        env:
          REQUESTED: ${{ inputs.mode }}
        run: |
          if [ -n "$REQUESTED" ] && [ "$REQUESTED" != "auto" ]; then
            MODE="$REQUESTED"
          else
            HOUR=$(date +%H)
            INDEX=$(( 10#$HOUR / 6 ))
            MOD=$(( INDEX % 3 ))
            if [ $MOD -eq 0 ]; then
              MODE="space"
            elif [ $MOD -eq 1 ]; then
              MODE="pacman"
            else
              MODE="snake"
            fi
          fi

          echo "mode=$MODE" >> $GITHUB_OUTPUT

      # Ensure dist exists and remove old graph files before rendering
      - name: Prepare dist directory
        run: |
          mkdir -p dist
          rm -f dist/contribution-graph.svg dist/pacman-contribution-graph.svg dist/pacman-contribution-graph-dark.svg dist/github-contribution-grid-space-shooter.svg dist/github-contribution-grid-space-shooter-dark.svg dist/gh-space-shooter.gif

      # MODE: Space Shooter
      - name: Generate Space Shooter
        if: steps.determine-mode.outputs.mode == 'space'
        uses: czl9707/gh-space-shooter@v2
        with:
          username: ${{ github.repository_owner }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Move Space Shooter output
        if: steps.determine-mode.outputs.mode == 'space'
        run: |
          if [ -f "dist/github-contribution-grid-space-shooter.svg" ]; then
            mv dist/github-contribution-grid-space-shooter.svg dist/gh-space-shooter.gif
          elif [ -f "dist/github-contribution-grid-space-shooter-dark.svg" ]; then
            mv dist/github-contribution-grid-space-shooter-dark.svg dist/gh-space-shooter.gif
          fi

      # MODE: Pacman 
      - name: Generate Pacman
        if: steps.determine-mode.outputs.mode == 'pacman'
        uses: abozanona/pacman-contribution-graph@main
        with:
          github_user_name: ${{ github.repository_owner }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_OPTIONS: "--max_old_space_size=8192"

      - name: Move Pacman output
        if: steps.determine-mode.outputs.mode == 'pacman'
        run: |
          if [ -f "dist/pacman-contribution-graph-dark.svg" ]; then
            mv dist/pacman-contribution-graph-dark.svg dist/pacman-contribution-graph.svg
          elif [ -f "dist/pacman-contribution-graph.svg" ]; then
            mv dist/pacman-contribution-graph.svg dist/pacman-contribution-graph.svg
          fi

      # MODE: Snake
      - name: Generate Snake
        if: steps.determine-mode.outputs.mode == 'snake'
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: dist/github-contribution-grid-snake.svg?palette=github-dark
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Update README to reference correct image
      - name: Update README for current mode
        run: |
          MODE="${{ steps.determine-mode.outputs.mode }}"
          if [ "$MODE" = "space" ]; then
            IMG="dist/gh-space-shooter.gif"
          elif [ "$MODE" = "pacman" ]; then
            IMG="dist/pacman-contribution-graph.svg"
          else
            IMG="dist/github-contribution-grid-snake.svg"
          fi
          sed -i "s|src=\"[^\"]*\"|src=\"$IMG\"|" README.md

      # Verify output exists and is non-empty
      - name: Verify output
        run: |
          MODE="${{ steps.determine-mode.outputs.mode }}"
          if [ "$MODE" = "space" ]; then
            FILE="dist/gh-space-shooter.gif"
          elif [ "$MODE" = "pacman" ]; then
            FILE="dist/pacman-contribution-graph.svg"
          else
            FILE="dist/github-contribution-grid-snake.svg"
          fi
          ls -la dist
          if [ ! -s "$FILE" ] || [ $(stat -c%s "$FILE") -lt 1000 ]; then
            echo "Output file missing or too small: $FILE"
            echo "Available files in dist:"
            ls -la dist || true
            exit 1
          fi

      # Stage and commit generated visual
      - name: Commit and push generated graph
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: update contribution graph [${{ steps.determine-mode.outputs.mode }}]"
