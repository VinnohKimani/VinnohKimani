name: Generate Profile Visuals

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "Which graph to generate"
        type: choice
        default: auto
        options:
          - auto
          - space
          - pacman
          - snake

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Pick the mode: manual choice wins, otherwise rotate every 6 hours
      - name: Determine MODE
        id: determine-mode
        env:
          REQUESTED: ${{ inputs.mode }}
        run: |
          if [ -n "$REQUESTED" ] && [ "$REQUESTED" != "auto" ]; then
            MODE="$REQUESTED"
          else
            HOUR=$(date +%H)
            INDEX=$(( 10#$HOUR / 6 ))
            MOD=$(( INDEX % 3 ))
            if [ $MOD -eq 0 ]; then
              MODE="space"
            elif [ $MOD -eq 1 ]; then
              MODE="pacman"
            else
              MODE="snake"
            fi
          fi

          # Space shooter outputs webp, the others output svg
          if [ "$MODE" = "space" ]; then
            EXT="webp"
          else
            EXT="svg"
          fi

          echo "mode=$MODE" >> $GITHUB_OUTPUT
          echo "ext=$EXT" >> $GITHUB_OUTPUT

      # Remove any previous graph so old files in other formats don't pile up
      - name: Prepare dist directory
        run: |
          mkdir -p dist
          rm -f dist/contribution-graph.*

      # --- MODE: Space Shooter ---
      - name: Generate Space Shooter
        if: steps.determine-mode.outputs.mode == 'space'
        uses: czl9707/gh-space-shooter@v2
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          output-path: dist/contribution-graph.webp

      # --- MODE: Pacman ---
      - name: Generate Pacman
        if: steps.determine-mode.outputs.mode == 'pacman'
        uses: abozanona/pacman-contribution-graph@main
        with:
          github_user_name: ${{ github.repository_owner }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_OPTIONS: "--max_old_space_size=8192"

      - name: Move Pacman output to dist/contribution-graph.svg
        if: steps.determine-mode.outputs.mode == 'pacman'
        run: |
          ls -la dist
          mv dist/pacman-contribution-graph-dark.svg dist/contribution-graph.svg

      # --- MODE: Snake ---
      - name: Generate Snake
        if: steps.determine-mode.outputs.mode == 'snake'
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: dist/contribution-graph.svg?palette=github-dark
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Fail early if the output is missing or suspiciously small
      - name: Verify output
        run: |
          FILE="dist/contribution-graph.${{ steps.determine-mode.outputs.ext }}"
          ls -la dist
          if [ ! -s "$FILE" ] || [ $(stat -c%s "$FILE") -lt 1000 ]; then
            echo "Output file missing or too small: $FILE"
            exit 1
          fi

      # Point the README image at the file that was just generated
      - name: Update README image path
        run: |
          sed -i -E 's#dist/contribution-graph\.[a-z]+#dist/contribution-graph.${{ steps.determine-mode.outputs.ext }}#g' README.md

      - name: Commit and push generated graph
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: update contribution graph [${{ steps.determine-mode.outputs.mode }}]"
