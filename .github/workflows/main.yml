
name: Generate Profile Visuals

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Determine MODE
        id: determine-mode
        run: |
          HOUR=$(date +%H)
          INDEX=$(( 10#$HOUR / 6 ))
          MOD=$(( INDEX % 3 ))
          if [ $MOD -eq 0 ]; then
            echo "mode=graph" >> $GITHUB_OUTPUT
          elif [ $MOD -eq 1 ]; then
            echo "mode=pacman" >> $GITHUB_OUTPUT
          else
            echo "mode=snake" >> $GITHUB_OUTPUT
          fi

      - name: Create dist directory
        run: mkdir -p dist

      # Mode 0: Activity Line Graph
      - name: Fetch Activity Line Graph
        if: steps.determine-mode.outputs.mode == 'graph'
        run: |
          curl -s "https://github-readme-activity-graph.vercel.app/graph?username=${{ github.repository_owner }}&theme=react-dark&area=true&hide_border=true" -o dist/contribution-graph.svg

      # Mode 1: Pacman
      - name: Generate Pacman
        if: steps.determine-mode.outputs.mode == 'pacman'
        uses: abozanona/pacman-contribution-graph@main
        with:
          github_user_name: ${{ github.repository_owner }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_OPTIONS: "--max_old_space_size=8192"

      - name: Move Pacman output to dist/contribution-graph.svg
        if: steps.determine-mode.outputs.mode == 'pacman'
        run: |
          mv dist/pacman-contribution-graph-dark.svg dist/contribution-graph.svg

      # Mode 2: Snake
      - name: Generate Snake
        if: steps.determine-mode.outputs.mode == 'snake'
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: dist/contribution-graph.svg?palette=github-dark
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Commit and Push
      - name: Commit and push generated graph
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: update contribution graph [${{ steps.determine-mode.outputs.mode }}]"

          
