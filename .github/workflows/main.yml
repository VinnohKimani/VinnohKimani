name: Generate Profile Visuals

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "Which graph to generate"
        type: choice
        default: auto
        options:
          - auto
          - space
          - pacman
          - snake

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Pick mode: manual choice wins, otherwise rotate every 6 hours
      - name: Determine MODE
        id: determine-mode
        env:
          REQUESTED: ${{ inputs.mode }}
        run: |
          if [ -n "$REQUESTED" ] && [ "$REQUESTED" != "auto" ]; then
            MODE="$REQUESTED"
          else
            HOUR=$(date +%H)
            INDEX=$(( 10#$HOUR / 6 ))
            MOD=$(( INDEX % 3 ))
            if [ $MOD -eq 0 ]; then
              MODE="space"
            elif [ $MOD -eq 1 ]; then
              MODE="pacman"
            else
              MODE="snake"
            fi
          fi

          echo "mode=$MODE" >> $GITHUB_OUTPUT

      - name: Prepare dist
        run: mkdir -p dist/graphs

      # MODE: Space Shooter
      - name: Generate Space Shooter
        if: steps.determine-mode.outputs.mode == 'space'
        uses: czl9707/gh-space-shooter@v2
        with:
          username: ${{ github.repository_owner }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      # MODE: Pacman
      - name: Generate Pacman
        if: steps.determine-mode.outputs.mode == 'pacman'
        uses: abozanona/pacman-contribution-graph@main
        with:
          github_user_name: ${{ github.repository_owner }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_OPTIONS: "--max_old_space_size=8192"

      # MODE: Snake
      - name: Generate Snake
        if: steps.determine-mode.outputs.mode == 'snake'
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: dist/github-contribution-grid-snake.svg?palette=github-dark
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Collect outputs
        run: |
          mkdir -p dist/graphs
          MODE="${{ steps.determine-mode.outputs.mode }}"
          if [ "$MODE" = "space" ]; then
            F=$(find . -type f \( -name 'github-contribution-grid-space-shooter*' -o -path '*space*shooter*' \) ! -path '*/node_modules/*' | head -1)
            [ -n "$F" ] && cp "$F" dist/graphs/gh-space-shooter.gif
          elif [ "$MODE" = "pacman" ]; then
            F=$(find . -type f -name '*pacman*contribution*' ! -path '*/node_modules/*' | head -1)
            [ -n "$F" ] && cp "$F" dist/graphs/pacman-contribution-graph.svg
          else
            F=$(find . -type f -name '*github-contribution-grid-snake*' ! -path '*/node_modules/*' | head -1)
            [ -n "$F" ] && cp "$F" dist/graphs/github-contribution-grid-snake.svg
          fi

      - name: Update README
        run: |
          MODE="${{ steps.determine-mode.outputs.mode }}"
          if [ "$MODE" = "space" ]; then IMG="dist/graphs/gh-space-shooter.gif"
          elif [ "$MODE" = "pacman" ]; then IMG="dist/graphs/pacman-contribution-graph.svg"
          else IMG="dist/graphs/github-contribution-grid-snake.svg"; fi
          sed -i -E "s|(<img[^>]+src=\")[^\"]+(\")|\\1${IMG//\//\\/}\\2|" README.md

      - name: Verify output
        run: |
          MODE="${{ steps.determine-mode.outputs.mode }}"
          if [ "$MODE" = "space" ]; then FILE="dist/graphs/gh-space-shooter.gif"
          elif [ "$MODE" = "pacman" ]; then FILE="dist/graphs/pacman-contribution-graph.svg"
          else FILE="dist/graphs/github-contribution-grid-snake.svg"; fi
          ls -la dist/graphs
          [ -s "$FILE" ] && [ $(stat -c%s "$FILE") -ge 1000 ] || { echo "Missing/too small: $FILE"; exit 1; }

      - name: Commit and push generated graph
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: update contribution graph [${{ steps.determine-mode.outputs.mode }}]"
