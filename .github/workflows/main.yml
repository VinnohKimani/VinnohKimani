name: Generate Profile Visuals

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      #  Clone repository files into the virtual runner environment
      - name: Checkout repository
        uses: actions/checkout@v3

      # SCalculate the current time slot to alternate between 3 graph modes
      - name: Determine MODE
        id: determine-mode
        run: |
          # Extract current hour in UTC (00 through 23)
          HOUR=$(date +%H)
          
          # Divide current hour by 6 to get the 6-hour interval index (0, 1, 2, or 3)
          # '10#' forces base-10 arithmetic so leading zeros (e.g., '08') do not break bash
          INDEX=$(( 10#$HOUR / 6 ))
          MOD=$(( INDEX % 3 ))
          if [ $MOD -eq 0 ]; then
            echo "mode=graph" >> $GITHUB_OUTPUT
          elif [ $MOD -eq 1 ]; then
            echo "mode=pacman" >> $GITHUB_OUTPUT
          else
            echo "mode=snake" >> $GITHUB_OUTPUT
          fi
          
      - name: Create dist directory
        run: mkdir -p dist

     # Mode 0: GitHub Stats & Commit Activity Graph
      - name: Fetch GitHub Stats Graph
        if: steps.determine-mode.outputs.mode == 'graph'
        run: |
          curl -fsSL -A "Mozilla/5.0" \
            "https://github-readme-stats.vercel.app/api?username=${{ github.repository_owner }}&show_icons=true&theme=react&hide_border=true" \
            -o dist/contribution-graph.svg

      # Mode 0: Activity Line Graph
     
      # - name: Fetch Activity Line Graph
      #   if: steps.determine-mode.outputs.mode == 'graph'
      #   run: |
      #     curl -fsSL -A "Mozilla/5.0" \
      #       "https://github-readme-activity-graph.vercel.app/graph?username=${{ github.repository_owner }}&theme=react-dark&area=true&hide_border=true" \
      #       -o dist/contribution-graph.svg
      #     # Fail if it's not a real SVG
      #     if ! grep -q "<svg" dist/contribution-graph.svg || [ $(stat -c%s dist/contribution-graph.svg) -lt 1000 ]; then
      #       echo "Downloaded file is not a valid SVG:"; cat dist/contribution-graph.svg
      #       exit 1
      #     fi

      - name: Generate Pacman
        if: steps.determine-mode.outputs.mode == 'pacman'
        uses: abozanona/pacman-contribution-graph@main
        with:
          github_user_name: ${{ github.repository_owner }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_OPTIONS: "--max_old_space_size=8192" # Provides extra RAM allocation for rendering

      # Move Pacman dark output to dist
      - name: Move Pacman output to dist/contribution-graph.svg
        if: steps.determine-mode.outputs.mode == 'pacman'
        run: |
          mv dist/pacman-contribution-graph-dark.svg dist/contribution-graph.svg

      - name: Generate Snake
        if: steps.determine-mode.outputs.mode == 'snake'
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: dist/contribution-graph.svg?palette=github-dark
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit and push generated graph
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: update contribution graph [${{ steps.determine-mode.outputs.mode }}]"

          
